name: Migrate Shadowing App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-shadowing-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Copy app from old repository
        run: |
          git clone --depth 1 https://github.com/ushisan029/remote.git /tmp/source
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/source/shadowing-app/ ./

      - name: Commit migrated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Migrate Daily Shadowing app from remote"
            git push
          fi
